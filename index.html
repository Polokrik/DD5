<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
</head>
<body>
    <script>
        // Define error handling for crash-safe mode
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            console.error('Error occurred:', msg, 'at', url, 'in line', lineNo, 'column', columnNo);
        };

        window.onunhandledrejection = function (event) {
            console.error('Unhandled rejection:', event.reason);
        };
    </script>
    <!-- Other game scripts go here -->
    <script src="game.js"></script>
</body>
</html>
